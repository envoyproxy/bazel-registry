matrix:
  platform:
  - debian11
  - ubuntu2404
  - macos
  bazel:
  - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--java_runtime_version=remotejdk_21"
    - "--tool_java_runtime_version=remotejdk_21"
    build_targets:
    - '@cel-cpp//...'
