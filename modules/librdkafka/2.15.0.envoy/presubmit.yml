bcr_test_module:
  # `test/MODULE.bazel` adds boringssl/zlib-ng and calls
  # `librdkafka.configure(...)`, so tasks below run against the extension-
  # configured dependency graph rather than librdkafka's default openssl/zlib
  # aliases.
  module_path: test
  matrix:
    platform:
    - debian11
    - macos
    - ubuntu2404
    bazel:
    - 8.x
  tasks:
    verify_targets:
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
      - '--@curl//:ssl_lib=openssl'
      build_targets:
      - '@librdkafka//:librdkafka'
      - '@librdkafka//:librdkafka_cpp'
      test_flags:
      - '--@curl//:ssl_lib=openssl'
      test_targets:
      - '@librdkafka//:all'
    verify_targets_no_features:
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
      - '--@librdkafka//:with_curl=false'
      - '--@librdkafka//:with_ssl=false'
      - '--@librdkafka//:with_zlib=false'
      - '--@librdkafka//:with_zstd=false'
      build_targets:
      - '@librdkafka//:librdkafka'
      - '@librdkafka//:librdkafka_cpp'
      test_flags:
      - '--@librdkafka//:with_curl=false'
      - '--@librdkafka//:with_ssl=false'
      - '--@librdkafka//:with_zlib=false'
      - '--@librdkafka//:with_zstd=false'
      test_targets:
      - '@librdkafka//:all'
    verify_targets_extension:
      name: Extension-configured boringssl/zlib-ng build
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
      - '--@curl//:ssl_lib=boringssl'
      build_targets:
      - '@librdkafka_deps//:crypto'
      - '@librdkafka_deps//:ssl'
      - '@librdkafka_deps//:zlib'
      - '@librdkafka//:librdkafka'
      - '@librdkafka//:librdkafka_cpp'
